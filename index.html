
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HV Visuals | Digital Guides</title>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
            body { background-color: #0F1016; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 50px 20px; }
            .profile-container { text-align: center; margin-bottom: 40px; }
            .logo { width: 120px; margin-bottom: 20px; }
            .bio { color: #cccccc; font-size: 16px; max-width: 400px; margin: 0 auto; line-height: 1.5; }
            .links-container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; }
            
            .link-card {
                background: rgba(255, 255, 255, 0.03);
                border: 1px solid rgba(134, 186, 255, 0.1);
                border-radius: 20px;
                padding: 15px;
                display: flex;
                align-items: center;
                text-decoration: none;
                color: white;
                transition: all 0.3s ease;
            }
            .link-card:hover {
                border-color: #86baff;
                background: rgba(134, 186, 255, 0.05);
                transform: translateY(-3px);
            }
            .mockup-img {
                width: 70px;
                height: auto;
                margin-right: 20px;
                filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
            }
            .card-text h3 { font-size: 22px; font-weight: 800; letter-spacing: 1px; margin-bottom: 5px; }
            .card-text p { font-size: 14px; color: #86baff; font-weight: 600; }
            
            .socials { margin-top: 50px; display: flex; gap: 20px; }
            .socials a { color: #fff; text-decoration: none; font-weight: 700; font-size: 14px; border-bottom: 1px solid transparent; }
            .socials a:hover { border-bottom: 1px solid #86baff; color: #86baff; }
        </style>
    </head>
    <body>
        <div class="profile-container">
            <img src="assets/logo.png" alt="HV Visuals" class="logo">
            <p class="bio">Premium digital travel guides. Explore cities like a local.</p>
        </div>
        
        <div class="links-container">
            
                <a href="https://hv-visuals.cz/rome" class="link-card" target="_blank">
                    <img src="assets/Rome_3D_Mockup.png" alt="ROME Guide" class="mockup-img">
                    <div class="card-text">
                        <h3>ROME</h3>
                        <p>Get the Digital Guide ➔</p>
                    </div>
                </a>
                
        </div>
        
        <div class="socials">
            <a href="https://instagram.com/hv_visuals" target="_blank">INSTAGRAM</a>
            <a href="https://tiktok.com/@hv_visuals" target="_blank">TIKTOK</a>
        </div>
    </body>
    </html>
